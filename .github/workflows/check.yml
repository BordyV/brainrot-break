# The checks that run without a Claude Code session. Type-checking needs the
# engine's types (plugin/.claude-plugin/types/, written by a session) and the plugin
# tests need the claude CLI, so `npx tsx tools/check.ts` stays the full check
# to run locally before a push.
name: check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Every kind is in the Kind union
        run: npx -y tsx@4.19.2 tools/sync-kinds.ts --check
      - name: Every video is translated in every language
        run: npx -y tsx@4.19.2 tools/sync-locales.ts --check
      - name: Every video runs and stays under the desktop's SVG limit
        run: npx -y tsx@4.19.2 tools/render.ts
